<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Unsent Memo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lato:wght@300;400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e8e4;
    --text: #1a1a1a;
    --text-muted: #999999;
    --text-light: #cccccc;
    --red: #c0392b;
    --green: #27ae60;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
  }

  /* LOGIN SCREEN */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--text);
    padding: 24px;
  }
  .login-box {
    background: #ffffff;
    padding: 56px 48px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .login-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .login-logo span { color: var(--red); }
  .login-sub {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 40px;
  }
  .login-label {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: left;
    margin-bottom: 10px;
  }
  .login-input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-size: 20px;
    letter-spacing: 0.3em;
    text-align: center;
    padding: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--text); }
  .login-input.error { border-color: var(--red); }
  .login-error {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    color: var(--red);
    margin-bottom: 16px;
    display: none;
  }
  .btn-login {
    width: 100%;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--text);
    color: #fff;
    border: none;
    padding: 14px;
    cursor: pointer;
    transition: background 0.18s;
  }
  .btn-login:hover { background: #333; }

  /* DASHBOARD */
  .dashboard { display: none; }
  nav {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    height: 68px;
  }
  .nav-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
    text-decoration: none;
  }
  .nav-logo span { color: var(--red); }
  .nav-badge {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--red);
    color: #fff;
    padding: 3px 10px;
    margin-left: 12px;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .nav-link {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    background: none;
    border: none;
    transition: color 0.2s;
  }
  .nav-link:hover { color: var(--text); }
  .tab-active { color: var(--text) !important; border-bottom: 2px solid var(--text); padding-bottom: 2px; }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #fff;
  }
  .stat-item {
    flex: 1;
    padding: 28px 40px;
    border-right: 1px solid var(--border);
  }
  .stat-item:last-child { border-right: none; }
  .stat-num {
    font-family: 'Oswald', sans-serif;
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-num.pending-color { color: var(--red); }
  .stat-num.approved-color { color: var(--green); }
  .stat-label {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* MAIN */
  .main {
    padding: 40px 48px 80px;
  }
  .section-heading {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .count-tag {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }

  /* PENDING CARDS */
  .pending-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .pending-card {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 5px solid #ddd;
    padding: 0;
    overflow: hidden;
  }
  .pending-card-body {
    padding: 28px 28px 20px;
  }
  .pending-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .pending-to {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
  }
  .mood-pill {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 10px;
    color: #fff;
    border-radius: 2px;
  }
  .company-tag {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--bg);
    color: var(--text-muted);
    padding: 3px 10px;
    border: 1px solid var(--border);
  }
  .pending-time {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    color: var(--text-light);
    margin-left: auto;
    letter-spacing: 0.04em;
  }
  .pending-text {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 1.85;
    color: #2a2a2a;
  }
  .pending-actions {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .action-btn {
    flex: 1;
    padding: 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .action-approve {
    background: transparent;
    color: var(--green);
    border-right: 1px solid var(--border);
  }
  .action-approve:hover { background: var(--green); color: #fff; }
  .action-reject {
    background: transparent;
    color: var(--text-muted);
  }
  .action-reject:hover { background: var(--red); color: #fff; }

  /* EMPTY */
  .empty-state {
    text-align: center;
    padding: 72px 24px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-light);
  }
  .empty-icon { font-size: 36px; margin-bottom: 16px; }

  /* APPROVED LIST */
  .approved-list {
    display: none;
  }
  .approved-row {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 5px solid #ddd;
    padding: 20px 24px;
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 12px;
  }
  .approved-text {
    flex: 1;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: #2a2a2a;
  }
  .approved-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }
  .btn-remove {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-remove:hover { border-color: var(--red); color: var(--red); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--text);
    color: #fff;
    padding: 12px 24px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 999;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.green { background: var(--green); }
  .toast.red { background: var(--red); }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .stats-bar { flex-wrap: wrap; }
    .stat-item { flex: 1 1 50%; }
    .main { padding: 24px 20px 48px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">UNSENT<span>.</span>MEMO</div>
    <div class="login-sub">Admin Panel</div>
    <label class="login-label">Enter admin PIN</label>
    <input class="login-input" id="pinInput" type="password" placeholder="••••••••" maxlength="20"
      onkeydown="if(event.key==='Enter') doLogin()" />
    <div class="login-error" id="loginError">Incorrect PIN. Try again.</div>
    <button class="btn-login" onclick="doLogin()">Enter</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <nav>
    <div style="display:flex;align-items:center;">
      <a class="nav-logo" href="index.html">UNSENT<span>.</span>MEMO</a>
      <span class="nav-badge" id="pendingBadge">0 pending</span>
    </div>
    <div class="nav-right">
      <button class="nav-link tab-active" id="tabPendingBtn" onclick="switchTab('pending')">Pending</button>
      <button class="nav-link" id="tabApprovedBtn" onclick="switchTab('approved')">Approved</button>
      <button class="nav-link" onclick="doLogout()">Log out</button>
    </div>
  </nav>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-num pending-color" id="statPending">0</div>
      <div class="stat-label">Awaiting Review</div>
    </div>
    <div class="stat-item">
      <div class="stat-num approved-color" id="statApproved">0</div>
      <div class="stat-label">Published</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Total Submitted</div>
    </div>
  </div>

  <div class="main">
    <!-- PENDING TAB -->
    <div id="tabPending">
      <div class="section-heading">
        Awaiting Approval
        <span class="count-tag" id="pendingCountTag"></span>
      </div>
      <div class="pending-list" id="pendingList"></div>
    </div>

    <!-- APPROVED TAB -->
    <div class="approved-list" id="tabApproved">
      <div class="section-heading">
        Published Memos
        <span class="count-tag" id="approvedCountTag"></span>
      </div>
      <div id="approvedList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PIN = 'memo2024';

const MOOD_COLORS = {
  frustrated: '#c0392b',
  grateful: '#27ae60',
  'burnt-out': '#7f8c8d',
  hopeful: '#e67e22',
  proud: '#8e44ad',
  conflicted: '#d35400',
  relieved: '#2980b9',
  resigned: '#95a5a6'
};

function doLogin() {
  const pin = document.getElementById('pinInput').value;
  if (pin === ADMIN_PIN) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    localStorage.setItem('unsent_admin_session', '1');
    loadDashboard();
  } else {
    const input = document.getElementById('pinInput');
    const err = document.getElementById('loginError');
    input.classList.add('error');
    err.style.display = 'block';
    setTimeout(() => { input.classList.remove('error'); input.value = ''; }, 1200);
  }
}

function doLogout() {
  localStorage.removeItem('unsent_admin_session');
  location.reload();
}

function getPending() { return JSON.parse(localStorage.getItem('unsent_pending') || '[]'); }
function getApproved() { return JSON.parse(localStorage.getItem('unsent_approved') || '[]'); }

function loadDashboard() {
  const pending = getPending();
  const approved = getApproved();

  document.getElementById('statPending').textContent = pending.length;
  document.getElementById('statApproved').textContent = approved.length;
  document.getElementById('statTotal').textContent = pending.length + approved.length;
  document.getElementById('pendingBadge').textContent = `${pending.length} pending`;
  document.getElementById('pendingCountTag').textContent = `${pending.length} memo${pending.length !== 1 ? 's' : ''}`;
  document.getElementById('approvedCountTag').textContent = `${approved.length} memo${approved.length !== 1 ? 's' : ''}`;

  renderPending(pending);
  renderApproved(approved);
}

function renderPending(pending) {
  const list = document.getElementById('pendingList');
  if (!pending.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">&#10003;</div>No memos waiting for review.</div>`;
    return;
  }
  list.innerHTML = pending.map((m, i) => {
    const color = MOOD_COLORS[m.mood] || '#aaa';
    const date = m.submittedAt ? new Date(m.submittedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
    return `<div class="pending-card" id="pcard-${m.id}" style="border-left-color:${color}">
      <div class="pending-card-body">
        <div class="pending-meta">
          <div class="pending-to">To: ${escHtml(m.to)}</div>
          <div class="mood-pill" style="background:${color}">${m.mood}</div>
          <div class="company-tag">${escHtml(m.company || 'Anonymous')}</div>
          <div class="pending-time">${date}</div>
        </div>
        <div class="pending-text">${escHtml(m.text)}</div>
      </div>
      <div class="pending-actions">
        <button class="action-btn action-approve" onclick="approve(${m.id})">&#10003; Approve &amp; Publish</button>
        <button class="action-btn action-reject" onclick="reject(${m.id})">&#10005; Reject</button>
      </div>
    </div>`;
  }).join('');
}

function renderApproved(approved) {
  const list = document.getElementById('approvedList');
  if (!approved.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128197;</div>No memos published yet.</div>`;
    return;
  }
  list.innerHTML = approved.map((m, i) => {
    const color = MOOD_COLORS[m.mood] || '#aaa';
    return `<div class="approved-row" style="border-left-color:${color}">
      <div class="approved-text">${escHtml(m.text)}</div>
      <div class="approved-meta">
        <div class="mood-pill" style="background:${color}">${m.mood}</div>
        <div class="company-tag">${escHtml(m.company || 'Anonymous')}</div>
        <button class="btn-remove" onclick="removeApproved(${i})">Remove</button>
      </div>
    </div>`;
  }).join('');
}

function approve(id) {
  let pending = getPending();
  const idx = pending.findIndex(m => m.id === id);
  if (idx === -1) return;
  const memo = pending.splice(idx, 1)[0];
  localStorage.setItem('unsent_pending', JSON.stringify(pending));

  const approved = getApproved();
  const { id: _id, submittedAt: _s, ...clean } = memo;
  approved.unshift(clean);
  localStorage.setItem('unsent_approved', JSON.stringify(approved));

  showToast('Published to archive', 'green');
  loadDashboard();
}

function reject(id) {
  let pending = getPending();
  const idx = pending.findIndex(m => m.id === id);
  if (idx === -1) return;
  pending.splice(idx, 1);
  localStorage.setItem('unsent_pending', JSON.stringify(pending));
  showToast('Memo rejected', 'red');
  loadDashboard();
}

function removeApproved(idx) {
  if (!confirm('Remove this memo from the archive?')) return;
  const approved = getApproved();
  approved.splice(idx, 1);
  localStorage.setItem('unsent_approved', JSON.stringify(approved));
  showToast('Removed from archive', 'red');
  loadDashboard();
}

function switchTab(tab) {
  const isPending = tab === 'pending';
  document.getElementById('tabPending').style.display = isPending ? 'block' : 'none';
  document.getElementById('tabApproved').style.display = isPending ? 'none' : 'block';
  document.getElementById('tabPendingBtn').classList.toggle('tab-active', isPending);
  document.getElementById('tabApprovedBtn').classList.toggle('tab-active', !isPending);
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type || ''}`;
  setTimeout(() => t.className = 'toast', 2500);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auto-login if session exists
if (localStorage.getItem('unsent_admin_session') === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}
</script>
</body>
</html>
