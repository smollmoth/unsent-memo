<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Unsent Memo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lato:wght@300;400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --white: #ffffff;
    --border: #e8e8e4;
    --text: #1a1a1a;
    --muted: #999;
    --light: #ccc;
    --green: #2D6A4F;
    --red: #C1121F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; min-height: 100vh; }

  /* LOGIN */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-box {
    background: var(--white);
    padding: 56px 48px;
    width: 100%;
    max-width: 420px;
    border-top: 4px solid var(--text);
  }
  .login-title {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .login-sub {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 32px;
    letter-spacing: 0.04em;
  }
  .login-box input {
    width: 100%;
    padding: 14px 16px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .login-box input:focus { border-color: var(--text); background: #fff; }
  .login-box button {
    width: 100%;
    padding: 15px;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--text);
    color: #fff;
    border: none;
    cursor: pointer;
    transition: background 0.18s;
  }
  .login-box button:hover { background: #333; }
  .login-box button:disabled { background: var(--light); cursor: not-allowed; }
  .login-error {
    color: var(--red);
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }

  /* ADMIN PANEL */
  .admin-panel { display: none; }

  .admin-nav {
    background: var(--text);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    height: 60px;
  }
  .admin-nav-title {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .admin-nav-right { display: flex; align-items: center; gap: 24px; }
  .admin-nav a {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .admin-nav a:hover { color: #fff; }
  .btn-logout {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.7);
    padding: 7px 18px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-logout:hover { border-color: #fff; color: #fff; }

  .stats-bar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 48px;
    display: flex;
    gap: 48px;
    flex-wrap: wrap;
  }
  .stat-num {
    font-family: 'Oswald', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-label {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .admin-content { padding: 40px 48px; }
  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .section-sub {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  /* MEMO REVIEW CARD */
  .memo-list { display: flex; flex-direction: column; gap: 16px; }
  .memo-review {
    background: var(--white);
    border: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 120px;
  }
  .memo-review-left { padding: 24px 28px; }
  .memo-meta {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .memo-body {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 1.75;
    margin-bottom: 12px;
  }
  .memo-date {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    color: var(--light);
    letter-spacing: 0.06em;
  }
  .memo-review-actions {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
  }
  .btn-approve, .btn-reject {
    flex: 1;
    border: none;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.18s, color 0.18s;
  }
  .btn-approve { background: var(--white); color: var(--green); border-bottom: 1px solid var(--border); }
  .btn-approve:hover { background: var(--green); color: #fff; }
  .btn-reject  { background: var(--white); color: var(--red); }
  .btn-reject:hover  { background: var(--red);   color: #fff; }

  .empty-msg {
    text-align: center;
    padding: 60px 24px;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--text);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 14px 24px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 640px) {
    .admin-nav, .stats-bar, .admin-content { padding-left: 20px; padding-right: 20px; }
    .memo-review { grid-template-columns: 1fr; }
    .memo-review-actions { flex-direction: row; border-left: none; border-top: 1px solid var(--border); }
    .btn-approve { border-bottom: none; border-right: 1px solid var(--border); }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">Admin Login</div>
    <div class="login-sub">Unsent Memo — Moderation Panel</div>
    <input type="password" id="passwordInput" placeholder="Enter admin password"
           onkeydown="if(event.key==='Enter') doLogin()" />
    <button id="loginBtn" onclick="doLogin()">Log In</button>
    <div class="login-error" id="loginError">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
  <nav class="admin-nav">
    <div class="admin-nav-title">Unsent Memo — Admin</div>
    <div class="admin-nav-right">
      <a href="index.html" target="_blank">View site</a>
      <button class="btn-logout" onclick="doLogout()">Log Out</button>
    </div>
  </nav>

  <div class="stats-bar">
    <div>
      <div class="stat-num" id="statPending">—</div>
      <div class="stat-label">Awaiting review</div>
    </div>
    <div>
      <div class="stat-num" id="statApproved">—</div>
      <div class="stat-label">Published</div>
    </div>
  </div>

  <div class="admin-content">
    <div class="section-title">Pending Memos</div>
    <div class="section-sub">Approve to publish publicly. Reject to discard.</div>
    <div class="memo-list" id="memoList">
      <div class="empty-msg">Loading…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function doLogin() {
  const pw  = document.getElementById('passwordInput').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  if (!pw) return;

  btn.disabled    = true;
  btn.textContent = 'Logging in…';
  err.style.display = 'none';

  try {
    const res  = await fetch('api/login.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      showPanel();
    } else {
      err.style.display = 'block';
      btn.disabled    = false;
      btn.textContent = 'Log In';
    }
  } catch (e) {
    err.textContent   = 'Could not connect to server.';
    err.style.display = 'block';
    btn.disabled    = false;
    btn.textContent = 'Log In';
  }
}

async function doLogout() {
  await fetch('api/logout.php', { method: 'POST' });
  document.getElementById('adminPanel').style.display  = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('passwordInput').value = '';
}

function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display  = 'block';
  loadStats();
  loadPending();
}

async function checkSession() {
  try {
    const res = await fetch('api/pending.php');
    if (res.ok) showPanel();
  } catch (e) {}
}

async function loadStats() {
  try {
    const data = await (await fetch('api/stats.php')).json();
    document.getElementById('statPending').textContent  = data.pending  ?? '—';
    document.getElementById('statApproved').textContent = data.approved ?? '—';
  } catch (e) {}
}

async function loadPending() {
  const list = document.getElementById('memoList');
  list.innerHTML = '<div class="empty-msg">Loading…</div>';
  try {
    const res  = await fetch('api/pending.php');
    if (res.status === 401) { doLogout(); return; }
    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      list.innerHTML = '<div class="empty-msg">No pending memos — you\'re all caught up ✓</div>';
      return;
    }

    list.innerHTML = data.map(m => `
      <div class="memo-review" id="memo-${m.id}">
        <div class="memo-review-left">
          <div class="memo-meta">
            <span>To: <strong>${escHtml(m.to)}</strong></span>
            <span>${escHtml(m.company)}</span>
            <span><span class="color-dot" style="background:${escHtml(m.color)}"></span>${escHtml(m.color)}</span>
          </div>
          <div class="memo-body">${escHtml(m.text)}</div>
          <div class="memo-date">Submitted: ${new Date(m.submitted_at).toLocaleString()}</div>
        </div>
        <div class="memo-review-actions">
          <button class="btn-approve" onclick="act(${m.id},'approve')">✓ Approve</button>
          <button class="btn-reject"  onclick="act(${m.id},'reject')">✕ Reject</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = '<div class="empty-msg">Error loading memos.</div>';
  }
}

async function act(id, type) {
  const el   = document.getElementById(`memo-${id}`);
  const btns = el.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);

  try {
    const res  = await fetch(`api/${type}.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      el.style.transition = 'opacity 0.3s, transform 0.3s';
      el.style.opacity    = '0';
      el.style.transform  = 'translateX(20px)';
      setTimeout(() => {
        el.remove();
        const list = document.getElementById('memoList');
        if (list.children.length === 0) {
          list.innerHTML = '<div class="empty-msg">No pending memos — you\'re all caught up ✓</div>';
        }
      }, 320);
      showToast(type === 'approve' ? '✓ Published to archive.' : '✕ Memo rejected.');
      loadStats();
    } else {
      showToast(data.error || 'Something went wrong.');
      btns.forEach(b => b.disabled = false);
    }
  } catch (e) {
    showToast('Network error.');
    btns.forEach(b => b.disabled = false);
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

checkSession();
</script>
</body>
</html>
