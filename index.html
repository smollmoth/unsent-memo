<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsent Memo — Say what you couldn't at work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lato:wght@300;400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f6f3;
    --border: #e8e8e4;
    --text: #1a1a1a;
    --text-muted: #999999;
    --text-light: #cccccc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    height: 68px;
  }
  .nav-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
  }
  .logo-img {
    height: 44px;
    width: auto;
    display: block;
  }
  .logo-fallback {
    display: none;
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .nav-link {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-link:hover { color: var(--text); }
  .btn-nav {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--text);
    color: #ffffff;
    padding: 11px 28px;
    text-decoration: none;
    transition: background 0.18s;
  }
  .btn-nav:hover { background: #333; }

  /* HERO */
  .hero {
    padding: 80px 48px 56px;
    text-align: center;
    border-bottom: 2px solid var(--text);
  }
  .hero h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(64px, 10vw, 140px);
    font-weight: 700;
    line-height: 0.92;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .hero-sub {
    margin-top: 20px;
    font-family: 'Lato', sans-serif;
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ARCHIVE */
  .archive {
    padding: 48px 48px 80px;
  }
  .archive-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 36px;
    gap: 20px;
    flex-wrap: wrap;
  }
  .archive-count {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 360px;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 11px 16px 11px 38px;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input::placeholder { color: var(--text-light); }
  .search-input:focus { border-color: var(--text); background: #fff; }

  /* GRID */
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  @media (max-width: 1100px) { .notes-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .notes-grid { grid-template-columns: 1fr; } }

  /* NOTE CARD */
  .note-card {
    padding: 28px 28px 24px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .note-card:nth-child(4n+1) { transform: rotate(-1.2deg); }
  .note-card:nth-child(4n+2) { transform: rotate(0.9deg); }
  .note-card:nth-child(4n+3) { transform: rotate(-0.6deg); }
  .note-card:nth-child(4n)   { transform: rotate(1.1deg); }
  .note-card:hover {
    transform: rotate(0deg) translateY(-6px) !important;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    z-index: 2;
  }
  .note-to {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 14px;
  }
  .note-text {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 1.75;
    flex: 1;
    word-break: break-word;
  }
  .note-footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0.45;
  }
  .company-label {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .anon-label {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* EMPTY STATE */
  .empty-state {
    display: none;
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    grid-column: 1 / -1;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    max-width: 560px;
    width: 100%;
    padding: 0;
    position: relative;
    animation: scaleIn 0.2s ease;
  }
  .modal-inner {
    padding: 40px 40px 32px;
  }
  .modal-close {
    position: absolute;
    top: 14px; right: 18px;
    background: none;
    border: none;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .modal-close:hover { opacity: 1; }
  .modal-to {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 20px;
  }
  .modal-text {
    font-family: 'Lato', sans-serif;
    font-size: 19px;
    line-height: 1.85;
  }
  .modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,0,0,0.12);
    opacity: 0.5;
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* FOOTER */
  footer {
    padding: 28px 48px;
    border-top: 2px solid var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .footer-copy {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }
  .footer-link {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-link:hover { color: var(--text); }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.97) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .hero { padding: 56px 20px 40px; }
    .archive { padding: 32px 20px 56px; }
    footer { padding: 24px 20px; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="logo.png" alt="Unsent Memo" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="logo-fallback">UNSENT MEMO</span>
  </a>
  <div class="nav-right">
    <a class="nav-link" href="index.html">Archive</a>
    <a class="nav-link" href="#" onclick="focusSearch(event)">Search</a>
    <a class="nav-link" href="privacy.html">Privacy</a>
    <a class="btn-nav" href="submit.html">Submit</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Unsent Memo</h1>
  <p class="hero-sub">Say what you couldn't at work</p>
</section>

<!-- ARCHIVE -->
<section class="archive">
  <div class="archive-top">
    <div class="archive-count" id="visibleCount"></div>
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Search by company or person..." oninput="render()" />
    </div>
  </div>
  <div class="notes-grid" id="notesGrid">
    <div class="empty-state" id="emptyState">No memos match your search.</div>
  </div>
</section>

<footer>
  <span class="footer-copy">© Muskan Singh (2026)</span>
  <a class="footer-link" href="privacy.html">Privacy policy</a>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="maybeClose(event)">
  <div class="modal" id="modal">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal()">Close &times;</button>
      <div class="modal-to" id="mTo"></div>
      <div class="modal-text" id="mText"></div>
      <div class="modal-footer">
        <span id="mCompany"></span>
        <span>Anonymous</span>
      </div>
    </div>
  </div>
</div>

<script>
const DEFAULT_COLORS = [
  '#1438BD','#C1121F','#2D6A4F','#6B2D8B',
  '#2B2D42','#E76F51','#0A7373','#7D2239',
  '#1A1A1A','#386641'
];

const SEED = [
  { text:"You asked for feedback but punished everyone who gave it. I stopped being honest after the third person got reassigned.", to:"My Manager", company:"Acme Corp", color:"#C1121F" },
  { text:"You went to bat for me when I didn't even know I needed it. I got that promotion because you said something in a room I wasn't in. Thank you.", to:"My Manager", company:"Stripe", color:"#2D6A4F" },
  { text:"I haven't taken a real day off in nine months. I reply to Slack on weekends. I wake up anxious. And you just sent a 7am Monday invite.", to:"HR", company:"Meta", color:"#2B2D42" },
  { text:"Every idea I brought to you ended up in your mouth in the next all-hands. No credit. No mention. I watched you get promoted on the back of my work.", to:"The CEO", company:"Acme Corp", color:"#1438BD" },
  { text:"I don't think you realize how much calmer everyone is when you're out of the office. That's not a compliment.", to:"My Manager", company:"Goldman Sachs", color:"#6B2D8B" },
  { text:"When I was falling apart after my dad died, you covered for me without making it a big deal. You just said 'take what you need.' I've never forgotten that.", to:"Sarah from Finance", company:"Shopify", color:"#0A7373" },
  { text:"I've been quietly applying for other jobs for four months. I feel guilty but mostly I feel relieved every time I get a callback.", to:"Myself", company:"McKinsey", color:"#7D2239" },
  { text:"I still think the idea I pitched in Q2 was better than what we actually built. The data proved it six months later. Nobody ever said anything.", to:"My Team", company:"Spotify", color:"#1438BD" },
  { text:"I cried in the bathroom after that feedback session. Not because you were wrong. Because you were right and I wasn't ready to hear it in front of everyone.", to:"My Manager", company:"Deloitte", color:"#E76F51" },
  { text:"You gave me a shot when my CV shouldn't have made the shortlist. I've been trying to justify that decision every single day since.", to:"The CEO", company:"Stripe", color:"#386641" },
  { text:"The 'open door policy' was never open. Every time someone walked through it, something bad happened to them. That door was a trap.", to:"HR", company:"Uber", color:"#C1121F" },
  { text:"I told myself I'd speak up in the next meeting. I've told myself that 47 times. I'm still waiting for the right moment.", to:"Myself", company:"Amazon", color:"#2B2D42" },
  { text:"You quietly mentored me for two years without calling it that. You answered my dumb questions at 9pm. You made me a better engineer.", to:"David K.", company:"Notion", color:"#0A7373" },
  { text:"The culture deck says we value work-life balance. The culture deck is fiction.", to:"The CEO", company:"WeWork", color:"#6B2D8B" },
  { text:"I actually love this job. I don't say that because I'm afraid it'll disappear. I come home excited. I don't take that for granted.", to:"Myself", company:"Basecamp", color:"#2D6A4F" },
  { text:"You fired someone two days before their stock vested. Everyone saw it. Nobody believed it was a coincidence. We just couldn't prove it.", to:"The CEO", company:"Acme Corp", color:"#7D2239" }
];

let allMessages = [];

function getTextColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.45 ? '#1a1a1a' : '#ffffff';
}

function initMessages() {
  if (!localStorage.getItem('unsent_seeded_v2')) {
    localStorage.setItem('unsent_approved', JSON.stringify(SEED));
    localStorage.setItem('unsent_seeded_v2', '1');
  }
  allMessages = JSON.parse(localStorage.getItem('unsent_approved') || '[]');
  // Migrate old entries without color
  allMessages = allMessages.map((m, i) => ({
    ...m,
    color: m.color || DEFAULT_COLORS[i % DEFAULT_COLORS.length]
  }));
}

function render() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('notesGrid');
  const empty = document.getElementById('emptyState');

  const filtered = allMessages.filter(m => {
    return !query ||
      (m.company || '').toLowerCase().includes(query) ||
      (m.to || '').toLowerCase().includes(query) ||
      (m.text || '').toLowerCase().includes(query);
  });

  document.getElementById('visibleCount').textContent =
    `${filtered.length} memo${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    grid.innerHTML = '';
    grid.appendChild(empty);
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map((m, i) => {
    const bg = m.color || DEFAULT_COLORS[i % DEFAULT_COLORS.length];
    const fg = getTextColor(bg);
    const idx = allMessages.indexOf(m);
    const preview = m.text.length > 280 ? m.text.slice(0, 280) + '…' : m.text;
    return `<div class="note-card" style="background:${bg};color:${fg}" onclick="openModal(${idx})">
      <div class="note-to">To: ${escHtml(m.to)}</div>
      <div class="note-text">${escHtml(preview)}</div>
      <div class="note-footer">
        <span class="company-label">${escHtml(m.company || 'Anonymous')}</span>
        <span class="anon-label">Anonymous</span>
      </div>
    </div>`;
  }).join('');
}

function openModal(idx) {
  const m = allMessages[idx];
  const bg = m.color || '#1a1a1a';
  const fg = getTextColor(bg);
  const modal = document.getElementById('modal');
  modal.style.background = bg;
  modal.style.color = fg;
  document.getElementById('mTo').textContent = `To: ${m.to}`;
  document.getElementById('mText').textContent = m.text;
  document.getElementById('mCompany').textContent = m.company || 'Anonymous';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function maybeClose(e) { if (e.target.id === 'modalOverlay') closeModal(); }
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function focusSearch(e) {
  e.preventDefault();
  document.getElementById('searchInput').focus();
  document.getElementById('searchInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initMessages();
render();
</script>
</body>
</html>
